name: symbolic-ml-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-derivations:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          python-version: "3.14"
          activate-environment: ml-sympy-env

      - name: Install dependencies
        run: |
          conda install -c conda-forge sympy numpy scipy matplotlib great-tables marimo -y

      - name: Run verification script
        run: |
          python verify_derivations.py

      - name: Export notebooks (optional)
        run: |
          for f in notes/*.py; do
            marimo export html "$f" -o "${f%.py}.html" || true
          done
        continue-on-error: true